<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <title>htmlify social preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        width: 1280px;
        height: 640px;
        margin: 0;
        overflow: hidden;
        color: #f8fafc;
        background:
          radial-gradient(
            circle at 88% 12%,
            rgba(124, 92, 255, 0.38),
            transparent 25rem
          ),
          #101a34;
      }

      main {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 54px;
        align-items: center;
        padding: 72px 80px;
      }

      .mark {
        margin: 0 0 18px;
        color: #a998ff;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 94px;
        line-height: 0.9;
        letter-spacing: -0.065em;
      }

      .tagline {
        max-width: 590px;
        margin: 30px 0 0;
        color: #cbd5e1;
        font-size: 28px;
        line-height: 1.32;
      }

      .modes {
        display: grid;
        gap: 18px;
      }

      .mode {
        padding: 26px 28px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 55px rgba(0, 0, 0, 0.18);
      }

      .mode:first-child {
        border-left: 6px solid #ff7657;
      }

      .mode:last-child {
        border-left: 6px solid #62d6b0;
      }

      .mode span {
        color: #a998ff;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .mode strong {
        display: block;
        margin-top: 8px;
        font-size: 28px;
      }

      .mode p {
        margin: 7px 0 0;
        color: #cbd5e1;
        font-size: 18px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p class="mark">trycopilot.ai</p>
        <h1>htmlify</h1>
        <p class="tagline">
          Turn dense Markdown into a source-checked
          decision surface or a formal printable document.
        </p>
      </section>
      <section class="modes" aria-label="Rendering modes">
        <article class="mode">
          <span>Curated mode</span>
          <strong>Interpret for decisions</strong>
          <p>
            Timelines, gates, comparisons, risks, and
            ownership made visible.
          </p>
        </article>
        <article class="mode">
          <span>Formal mode</span>
          <strong>Preserve for print</strong>
          <p>
            Deterministic HTML with optional PDF export.
          </p>
        </article>
      </section>
    </main>
  </body>
</html>
